<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panda Bamboo Jump</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1b2a1b; font-family: Arial, sans-serif; user-select: none;
  }
  #wrap { position: relative; }
  canvas {
    display: block; border: 4px solid #2e5e2e; border-radius: 12px;
    max-width: 96vw; max-height: 75vh;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(0, 40, 0, 0.78); color: #fff; border-radius: 10px;
    padding: 20px; box-sizing: border-box;
  }
  #overlay h1 { font-size: 32px; margin: 0 0 15px; }
  #msg { font-size: 17px; line-height: 1.7; margin-bottom: 25px; }
  #actionBtn {
    font-size: 24px; font-weight: bold; padding: 12px 40px;
    border: none; border-radius: 12px; background: #ffb300; color: #222; cursor: pointer;
  }
  #controls { margin-top: 12px; display: flex; gap: 30px; }
  #controls button {
    font-size: 28px; width: 90px; height: 60px; border: none; border-radius: 14px;
    background: #4caf50; color: #fff; cursor: pointer; touch-action: manipulation;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="overlay">
    <h1 id="title"></h1>
    <div id="msg"></div>
    <button id="actionBtn">PLAY</button>
  </div>
</div>

<div id="controls">
  <button id="leftBtn">◀</button>
  <button id="rightBtn">▶</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LANES = [100, 200, 300];
const PANDA_Y = 470;

const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');
const actionBtn = document.getElementById('actionBtn');

let state = 'start';
let panda, obstacles, score, lives, speed, spawnTimer, hitTimer;
let best = 0;

// ---------- Sound (koi file nahi chahiye) ----------
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(f1, f2, dur, type = 'sine', vol = 0.15) {
  try {
    const ac = getAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    const t = ac.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfxJump  = () => tone(400, 900, 0.2);          // jump: awaaz upar
const sfxHit   = () => tone(200, 80, 0.4, 'sawtooth', 0.2); // hit: awaaz neeche
const sfxPoint = () => tone(700, 1000, 0.1);         // speed badhne par

// ---------- Setup ----------
function reset() {
  panda = { lane: 1, x: LANES[1], jumpT: 0 };
  obstacles = [];
  score = 0;
  lives = 3;
  speed = 3;
  spawnTimer = 0;
  hitTimer = 0;
}

function begin() {
  getAudio(); // browser mein sound pehle user click par unlock hota hai
  reset();
  state = 'playing';
  overlay.style.display = 'none';
}

function movePanda(dir) {
  if (state !== 'playing') return;
  const newLane = panda.lane + dir;
  if (newLane < 0 || newLane > 2) return;
  panda.lane = newLane;
  panda.jumpT = 1;
  sfxJump();
}

// ---------- Screens ----------
function setScreen() {
  if (state === 'start') {
    titleEl.textContent = '🐼 Panda Bamboo Jump';
    msgEl.innerHTML =
      'Panda bamboo par baitha hai.<br>' +
      '◀ ▶ Arrow keys (ya buttons) se bamboo badlo<br>' +
      'Patthar (rocks) se bacho!<br>' +
      '3 lives hain ❤❤❤<br>' +
      'Har 10 patthar bachane par speed badhegi';
    actionBtn.textContent = 'PLAY';
  } else if (state === 'over') {
    titleEl.textContent = 'Game Over';
    msgEl.innerHTML = 'Score: ' + score + '<br>Best: ' + best;
    actionBtn.textContent = '🔄 Restart';
  }
  overlay.style.display = 'flex';
}

actionBtn.onclick = begin;

// ---------- Controls ----------
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); movePanda(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); movePanda(1); }
  else if ((e.key === 'Enter' || e.key === ' ') && state !== 'playing') {
    e.preventDefault(); begin();
  }
});
document.getElementById('leftBtn').addEventListener('pointerdown', () => movePanda(-1));
document.getElementById('rightBtn').addEventListener('pointerdown', () => movePanda(1));

// ---------- Update (game logic) ----------
function update() {
  if (state !== 'playing') return;

  panda.x += (LANES[panda.lane] - panda.x) * 0.25;
  if (panda.jumpT > 0) panda.jumpT -= 0.05;
  if (hitTimer > 0) hitTimer--;

  spawnTimer--;
  if (spawnTimer <= 0) {
    obstacles.push({ lane: Math.floor(Math.random() * 3), y: -40, passed: false });
    spawnTimer = Math.max(35, 80 - score * 2);
  }

  for (const o of obstacles) {
    o.y += speed;

    if (!o.passed && o.y > PANDA_Y + 30) {
      o.passed = true;
      score++;
      if (score % 10 === 0) { speed += 0.5; sfxPoint(); }
    }

    if (hitTimer === 0 && !o.passed && o.lane === panda.lane && Math.abs(o.y - PANDA_Y) < 30) {
      lives--;
      hitTimer = 90;
      o.passed = true;
      sfxHit();
      if (lives <= 0) {
        state = 'over';
        best = Math.max(best, score);
        setScreen();
        return;
      }
    }
  }

  obstacles = obstacles.filter(o => o.y < H + 50);
}

// ---------- Drawing ----------
function drawBamboo(x) {
  ctx.fillStyle = '#5fae4e';
  ctx.fillRect(x - 12, 0, 24, H);
  ctx.fillStyle = '#3d7d33';
  for (let y = 20; y < H; y += 80) ctx.fillRect(x - 14, y, 28, 6);
}

function drawRock(x, y) {
  ctx.fillStyle = '#8d6e63';
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
}

function drawPanda(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-10, 28, 7, 6, 0, 0, Math.PI * 2);
  ctx.ellipse(10, 28, 7, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(0, 5, 22, 26, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-20, 0, 6, 12, 0, 0, Math.PI * 2);
  ctx.ellipse(20, 0, 6, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, -22, 18, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(-14, -38, 6, 0, Math.PI * 2);
  ctx.arc(14, -38, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(-8, -22, 6, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(8, -22, 6, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, -22, 2.5, 0, Math.PI * 2);
  ctx.arc(8, -22, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(0, -13, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#9fdcff');
  grad.addColorStop(1, '#d9f5c5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  for (const x of LANES) drawBamboo(x);
  for (const o of obstacles) drawRock(LANES[o.lane], o.y);

  if (state === 'playing' || state === 'over') {
    const jumpOffset = panda.jumpT > 0 ? -Math.sin(panda.jumpT * Math.PI) * 30 : 0;
    const blinkHidden = hitTimer > 0 && Math.floor(hitTimer / 6) % 2 === 0;
    if (!blinkHidden) drawPanda(panda.x, PANDA_Y + jumpOffset);

    ctx.font = 'bold 22px Arial';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.strokeText('Score: ' + score, 10, 30);
    ctx.fillText('Score: ' + score, 10, 30);

    ctx.textAlign = 'right';
    const hearts = '❤'.repeat(lives) + '🖤'.repeat(3 - lives);
    ctx.strokeText(hearts, W - 10, 30);
    ctx.fillText(hearts, W - 10, 30);
  }
}

// ---------- Game loop ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
setScreen();
loop();
</script>
</body>
</html>
